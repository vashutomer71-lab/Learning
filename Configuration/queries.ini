[queries]
all_niyat_tile_count_query = SELECT COUNT(*) AS total_count, COUNT(*) FILTER (WHERE n.status = 1) AS active_count, COUNT(*) FILTER (WHERE n.status = 3) AS completed_count, COUNT(*) FILTER (WHERE n.status = 2) AS approval_pending_count, COUNT(*) FILTER (WHERE n.status = 0) AS deactivated_count FROM niyat n WHERE n.its_id IN (%s) AND n.commited_value != '0' AND ((n.quest_type = 'RADIO' AND n.commited_value != '2') OR (n.commited_value = '2' AND n.quest_type != 'RADIO') OR (n.commited_value != '2' AND n.quest_type != 'RADIO'));

1_month_niyat_tile_count_query = SELECT COUNT(*) AS total_count, COUNT(*) FILTER (WHERE n.status = 1) AS active_count, COUNT(*) FILTER (WHERE n.status = 3) AS completed_count, COUNT(*) FILTER (WHERE n.status = 2) AS approval_pending_count, COUNT(*) FILTER (WHERE n.status = 0) AS deactivated_count FROM niyat n WHERE n.its_id IN (%s) AND n.commited_value != '0' AND ((n.quest_type = 'RADIO' AND n.commited_value != '2') OR (n.commited_value = '2' AND n.quest_type != 'RADIO') OR (n.commited_value != '2' AND n.quest_type != 'RADIO'))AND niyat_date >= CURRENT_DATE - INTERVAL '1 month';
3_month_niyat_tile_count_query = SELECT COUNT(*) AS total_count, COUNT(*) FILTER (WHERE n.status = 1) AS active_count, COUNT(*) FILTER (WHERE n.status = 3) AS completed_count, COUNT(*) FILTER (WHERE n.status = 2) AS approval_pending_count, COUNT(*) FILTER (WHERE n.status = 0) AS deactivated_count FROM niyat n WHERE n.its_id IN (%s) AND n.commited_value != '0' AND ((n.quest_type = 'RADIO' AND n.commited_value != '2') OR (n.commited_value = '2' AND n.quest_type != 'RADIO') OR (n.commited_value != '2' AND n.quest_type != 'RADIO'))AND niyat_date >= CURRENT_DATE - INTERVAL '3 months';
