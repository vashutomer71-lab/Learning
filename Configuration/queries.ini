[queries]
fleet_tile_count_query=  select count(e.id) as totalCount,count( case when e.is_active =true then 1 else null end ) as activeCount, count(case when  e.is_active=false  then 1 else null end ) as inactiveCount from _enterprise e where 1=1  and e.cluster_id <@ 'N12084';
vehicle_tile_count_query = select count(*) as total_vehicle_count,count(case when status='Moving' then 1 end) as moving_count,count(case when status='Idle' then 1 end) as Idel_count,count(case when status='At Depot' then 1 end) as parked_count from vehicle_association va where network_id =12084 and is_active =true;
depot_tile_count_query = SELECT COUNT(*) AS total_site_count, COUNT(CASE WHEN LOWER(s.status) = 'commissioned' THEN 1 END) AS commissioned_count, COUNT(CASE WHEN LOWER(s.status) = 'decommissioned' THEN 1 END) AS decommissioned_count, COUNT(CASE WHEN LOWER(s.status) = 'upcoming' THEN 1 END) AS upcoming_count, COUNT(CASE WHEN LOWER(s.status) = 'under_maintenance' THEN 1 END) AS under_maintenance_count FROM _site s LEFT JOIN _enterprise e ON s.enterprise_id = e.id LEFT JOIN address a ON s.address_id = a.id WHERE s.cluster_id <@ 'N12084' AND s.is_active = TRUE;
charger_tile_count_query = WITH c AS (SELECT DISTINCT ON (a.id) cs.computed_status FROM _asset a INNER JOIN make m ON m.id = a.make_id INNER JOIN model m2 ON m2.id = a.model_id INNER JOIN _port p ON p.charger_id = a.id INNER JOIN _site s ON s.id = a.site_id INNER JOIN address add ON s.address_id = add.id INNER JOIN state st ON add.state_id = st.id INNER JOIN country ct ON st.country_id = ct.id INNER JOIN _enterprise e ON s.enterprise_id = e.id INNER JOIN _network net ON net.id = e.network_id LEFT OUTER JOIN charger_status cs ON cs.charger_id = a.id WHERE a.is_active IS TRUE AND a.asset_type = 'CHARGER' AND a.cluster_id <@ 'N12084' ORDER BY a.id DESC) SELECT COUNT(CASE WHEN c.computed_status = 'Offline' THEN 1 WHEN c.computed_status = 'Available' THEN 1 WHEN c.computed_status = 'Busy' THEN 1 WHEN c.computed_status = 'Faulted' THEN 1 ELSE CASE WHEN c.computed_status IS NULL THEN 1 ELSE 0 END END), computed_status FROM c GROUP BY computed_status;




fetch_active_users = SELECT COUNT(CASE WHEN is_active = true THEN 1 END) AS active_user_count,  COUNT(CASE WHEN is_active = false THEN 1 END) AS inactive_user_count FROM user_details ud WHERE network_id = 12084 AND role = 'Operator';
fetch_user_by_id = select * from user_details ud where network_id =12084 and role ='Driver';

depot_chart_count_query = SELECT COUNT(*) AS total_site_count, COUNT(CASE WHEN LOWER(s.status) = 'commissioned' THEN 1 END) AS commissioned_count, COUNT(CASE WHEN LOWER(s.status) = 'decommissioned' THEN 1 END) AS decommissioned_count, COUNT(CASE WHEN LOWER(s.status) = 'upcoming' THEN 1 END) AS upcoming_count, COUNT(CASE WHEN LOWER(s.status) = 'under_maintenance' THEN 1 END) AS under_maintenance_count FROM _site s LEFT JOIN _enterprise e ON s.enterprise_id = e.id LEFT JOIN address a ON s.address_id = a.id WHERE s.cluster_id <@ 'N12084' AND s.is_active = TRUE;
Energy_query = select sum(pt.energy_used) as todayEnergy, (select sum(pt.grand_total) as todayCost from invoice_details pt left join _site s on pt.site_id = s.id left join user_details u on pt.user_id = u.id where (case when pt.occasion in (0,1) then coalesce(s.cluster_id, '') <@ 'N12084' when pt.occasion in (4,5) then coalesce(u.cluster_id, '') <@ 'N12084' end) and pt.is_paid is true and (pt.created_at at time zone 'UTC' at time zone 'Asia/Kolkata' between (cast(now() at time zone 'Asia/Kolkata' as timestamp) - cast(now() at time zone 'Asia/Kolkata' as time) + interval '1 sec') and now() at time zone 'Asia/Kolkata'))) from invoice_details pt left join _site s on pt.site_id = s.id where pt.occasion in (0) and pt.is_paid is true and coalesce(s.cluster_id, '') <@ 'N12084' and (pt.created_at at time zone 'UTC' at time zone 'Asia/Kolkata' between (cast(now() at time zone 'Asia/Kolkata' as timestamp) - cast(now() at time zone 'Asia/Kolkata' as time) + interval '1 sec') and now() at time zone 'Asia/Kolkata'))
energy_tile_query =  select sum(pt.energy_used) over() as total_energy, sum(pt.energy_used) over() / (sum(cast(current_date - min(date(pt.created_at at time zone 'UTC' at time zone 'Asia/Kolkata')) as numeric)) over() + 1) as average_energy, (select sum(pt.grand_total) as total_cost from invoice_details pt left join _site s on pt.site_id = s.id left join user_details u on pt.user_id = u.id where case when pt.occasion in (0,1) then coalesce(s.cluster_id, '') <@ 'N12084' when pt.occasion in (4,5) then coalesce(u.cluster_id, '') <@ 'N12084' end and pt.is_paid is true), (select sum(pt.grand_total) over() / (sum(cast(current_date - min(date(pt.created_at at time zone 'UTC' at time zone 'Asia/Kolkata')) as numeric)) over() + 1) as avg_total_cost from invoice_details pt left join _site s on pt.site_id = s.id left join user_details u on pt.user_id = u.id where case when pt.occasion in (0,1) then coalesce(s.cluster_id, '') <@ 'N12084' when pt.occasion in (4,5) then coalesce(u.cluster_id, '') <@ 'N12084' end and pt.is_paid is true group by pt.id limit 1) from invoice_details pt left join _site s on pt.site_id = s.id where pt.occasion in (0) and pt.is_paid is true and coalesce(s.cluster_id, '') <@ 'N12084' group by pt.id limit 1
charging_infrastructure_bottom_tile_count = select (select count(distinct site.id) from _site site where site.cluster_id <@ 'N12084' and site.is_active = true) as siteCount, (select count(distinct case when lower(c.asset_type) = 'charger' then c.id end) from _site site inner join _asset c on site.id = c.site_id and c.asset_type = 'CHARGER' where site.cluster_id <@ 'N12084' and c.is_active = true) as chargerCount, (select count(e.id) from _enterprise e where e.cluster_id <@ 'N12084' and e.is_active = true) as enterpriseCount;


vehicle_chart_count_query = select count(*) as total_vehicle_count,count(case when status='Moving' then 1 end) as moving_count,count(case when status='Idle' then 1 end) as Idel_count,count(case when status='At Depot' then 1 end) as parked_count from vehicle_association va where network_id =12084 and is_active =true;