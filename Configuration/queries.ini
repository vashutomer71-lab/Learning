1_year_niyat_tile_count_query = SELECT COUNT(*) AS total_count, COUNT(*) FILTER (WHERE n.status = 1) AS active_count, COUNT(*) FILTER (WHERE n.status = 3) AS completed_count, COUNT(*) FILTER (WHERE n.status = 2) AS approval_pending_count, COUNT(*) FILTER (WHERE n.status = 0) AS deactivated_count FROM niyat n WHERE n.its_id IN (%s) AND n.commited_value != '0' AND ((n.quest_type = 'RADIO' AND n.commited_value != '2') OR (n.commited_value = '2' AND n.quest_type != 'RADIO') OR (n.commited_value != '2' AND n.quest_type != 'RADIO'))AND niyat_date >= CURRENT_DATE - INTERVAL '1 Year';
mumin_total_trophy_reward =  select sum(trophies_awarded) as total_niyat_count from niyat n where its_id IN(%s);
mumin_trophies_redeemed= select sum(trophies_redeemed) as Trophies_Redeemed from redeem_trophies rt where its_id IN(%s);
mumin_trophies_balance = SELECT COALESCE((SELECT SUM(trophies_awarded) FROM niyat WHERE its_id IN(%s)), 0) - COALESCE((SELECT SUM(trophies_redeemed) FROM redeem_trophies WHERE its_id IN(%s)), 0) AS balance_trophies;
; umoor_name_id= select id, ue.umoor_name  from umoor_entity ue order by id desc;
get_umoor_id_by_name = SELECT id, umoor_name FROM umoor_entity WHERE umoor_name = %s;


mumin_total_niyat_fmb_umoor_after_search = select count(*) as total_niyats from niyat n where its_id IN(%s) and umoor_id in(%s) AND n.commited_value != '0' AND ((n.quest_type = 'RADIO' AND n.commited_value != '2') OR (n.commited_value = '2' AND n.quest_type != 'RADIO') OR (n.commited_value != '2' AND n.quest_type != 'RADIO'));

mumin_trophies_count = SELECT COALESCE(awarded.total_awarded, 0) AS total_awarded, COALESCE(redeemed.total_redeemed, 0) AS total_redeemed, (COALESCE(awarded.total_awarded, 0) - COALESCE(redeemed.total_redeemed, 0)) AS balance_trophies FROM (SELECT its_id, SUM(trophies_awarded) AS total_awarded FROM niyat WHERE its_id = %s GROUP BY its_id) awarded LEFT JOIN  (SELECT its_id, SUM(trophies_redeemed) AS total_redeemed FROM redeem_trophies WHERE its_id in(%s) GROUP BY its_id) redeemed ON awarded.its_id = redeemed.its_id;